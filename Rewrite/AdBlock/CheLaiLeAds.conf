// ==UserScript==
// @ScriptName        车来了(小程序)净化
// @Author            
// @Function          如果有需要的去除广告的APP，可自行在共享表格中添加需求
// @AddRequest        https://bit.ly/addRequestforAdBlock
// @UpdateTime        2025-10-09
// @Suitable          自行观看“# > ”注释内容
// @Attention         使用前请卸载汽水音乐，挂载脚本然后使用
// @Attention         如需引用请注明出处，谢谢合作！
// @Version           V1.0.2
// @ScriptURL         https://github.com/ByteTimes/FilterRules/raw/Rules/Rewrite/AdBlock/CheLaiLeAds.cof
