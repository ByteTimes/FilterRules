// ==UserScript==
// @ScriptName        菜鸟[菜鸟裹裹](支付宝小程序)净化            
// @UpdateTime        2025-10-07
// @Suitable          自行观看“# > ”注释内容
// @Attention         使用前请卸载菜鸟APP，挂载脚本然后使用
// @Attention         如需引用请注明出处，谢谢合作！
// @Version           V1.0.16
// @ScriptURL         https://github.com/ByteTimes/FilterRules/raw/Rules/Rewrite/AdBlock/CainiaoAds.conf
// ==/UserScript==


hostname=*.cainiao.com, guide-acs.m.taobao.com, acs4miniapp-inner.m.taobao.com


# > 菜鸟裹裹_amdc处理
^http:\/\/amdc\.m\.taobao\.com url script-response-body https://github.com/ByteTimes/FilterRules/raw/Rules/Scripts/amdc.js
# > 菜鸟裹裹_我的页面去除推广[卸载重装]
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch url script-response-body https://github.com/ByteTimes/FilterRules/raw/Rules/Scripts/cainiao_json.js
# > 菜鸟裹裹_首页中部的问邻居推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbpresentation\.homepage\.merge\.get\.cn url script-response-body https://github.com/ByteTimes/FilterRules/raw/Rules/Scripts/cainiao_json.js
# > 菜鸟裹裹_首页中部的惊喜福利推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbpresentation\.protocol\.homepage\.get\.cn url script-response-body https://github.com/ByteTimes/FilterRules/raw/Rules/Scripts/cainiao_json.js
# > 菜鸟裹裹_搜索框下方今日好物推荐
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.adkeyword url script-response-body https://github.com/ByteTimes/FilterRules/raw/Rules/Scripts/cainiao_json.js
# > 菜鸟裹裹_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.(?!.*_home) url reject-200
# > 菜鸟裹裹_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.mshow\.cn url reject-200
# > 菜鸟裹裹_首页底部商品推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.nbcps\.presentation\.fetch\.cn url reject-200
# > 菜鸟裹裹_底部角标推广
^https?:\/\/[a-zA-Z0-9_.-]+\.cainiao\.com\/gw\/mtop\.cainiao\.app\.home\.v\d+\.bottom\.area url reject-200


# > 菜鸟裹裹_支付宝小程序_通用广告请求
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.guoguo\.nbnetflow\.ads\. url reject-200
# > 菜鸟裹裹_支付宝小程序_底部商品推广新
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.alimama\.abyss\.unionpage\.get url reject-200
# > 菜鸟裹裹_支付宝小程序_底部商品推广旧
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.adx\.flyad\.getad url reject-200
# > 菜鸟裹裹_支付宝小程序_匿名选择
^https?:\/\/[a-zA-Z0-9_.-]+\.taobao\.com\/gw\/mtop\.cainiao\.nbmensa\.research\.researchservice\.consultmerge url reject-200
